name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}      

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
      - name: Setup Maven 3.8.8
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz -o /tmp/maven.tar.gz
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.8.8/bin" >> "$GITHUB_PATH"
          
      - name: Build Android APK
        continue-on-error: true
        run: |
          mvn -version
          mvn -Pandroid gluonfx:build gluonfx:package

      - name: Show GluonFX logs
        if: always()
        run: |
          echo "===== LOGS DO GLUONFX ====="
          find target/gluonfx -type f -name "*.log" -print || true

          echo "===== PROCESS COMPILE ====="
          cat target/gluonfx/log/process-compile-*.log || true

          echo "===== LOGS GVM ====="
          find target/gluonfx/aarch64-android/gvm/log -type f -maxdepth 1 -print -exec sh -c 'echo "===== $1 ====="; tail -n 200 "$1"' _ {} \;

          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frequencia-87-apk
          path: target/gluonfx/aarch64-android/gvm/*.apk
